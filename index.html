<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/mswdo-logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/mswdo-pwa-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#581c87" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MSWDO Vinzons" />
    <title>MSWDO Vinzons</title>
    <script>
      // If already shown during this session, do not replay splash
      try {
        if (sessionStorage.getItem('mswdo_pwa_splash_shown')) {
          document.documentElement.classList.add('no-splash');
        }
      } catch (e) {}
    </script>
    <style>
      .no-splash #pwa-splash-screen {
        display: none !important;
      }

      /* Unified Single Splash Screen on PWA Launch */
      #pwa-splash-screen {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: linear-gradient(160deg, #4c1d95 0%, #581c87 50%, #3b0764 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: opacity, transform;
      }

      #pwa-splash-screen.pwa-splash-fade-out {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }

      .pwa-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        max-width: 340px;
        width: 100%;
        box-sizing: border-box;
      }

      /* Single smooth zoom: starts smaller, expands bigger */
      .pwa-splash-logo-container {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: #ffffff;
        padding: 5px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35), 0 0 0 5px rgba(255, 255, 255, 0.16);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        box-sizing: border-box;
        animation: pwaLogoZoomIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        will-change: transform, opacity;
      }

      .pwa-splash-logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 50%;
        display: block;
      }

      .pwa-splash-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        animation: pwaBrandFadeIn 0.65s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .pwa-splash-title {
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 1.6rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
      }

      .pwa-splash-subtitle {
        color: #e9d5ff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin: 0;
        opacity: 0.95;
      }

      .pwa-splash-loader {
        margin-top: 30px;
        width: 48px;
        height: 4px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
        animation: pwaBrandFadeIn 0.5s 0.3s both;
      }

      .pwa-splash-pulse {
        width: 50%;
        height: 100%;
        background: #c4b5fd;
        border-radius: 4px;
        position: absolute;
        animation: pwaPulseBar 1.2s infinite ease-in-out;
      }

      /* Zoom out (starts small) to Zoom in (grows bigger) */
      @keyframes pwaLogoZoomIn {
        0% {
          opacity: 0;
          transform: scale(0.35) translateY(12px);
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      @keyframes pwaBrandFadeIn {
        0% {
          opacity: 0;
          transform: translateY(8px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pwaPulseBar {
        0% {
          left: -50%;
        }
        100% {
          left: 100%;
        }
      }
    </style>
  </head>
  <body>
    <!-- App Root for React -->
    <div id="root"></div>

    <!-- Single Seamless PWA Launch Splash Screen -->
    <div id="pwa-splash-screen" class="pwa-splash" aria-hidden="true">
      <div class="pwa-splash-inner">
        <div class="pwa-splash-logo-container">
          <img src="/mswdo-logo.png" alt="MSWDO Vinzons" class="pwa-splash-logo" />
        </div>
        <div class="pwa-splash-brand">
          <h1 class="pwa-splash-title">MSWDO - Vinzons</h1>
          <p class="pwa-splash-subtitle">Evacuee Management System</p>
        </div>
        <div class="pwa-splash-loader">
          <div class="pwa-splash-pulse"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
