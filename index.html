<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/mswdo-logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/mswdo-pwa-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#581c87" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MSWDO Vinzons" />
    <title>MSWDO Vinzons</title>
    <script>
      try {
        const navigation = performance.getEntriesByType('navigation')[0];
        if (navigation?.type === 'reload') {
          document.documentElement.classList.add('skip-app-splash');
        }
      } catch {
        // Keep the splash enabled when navigation timing is unavailable.
      }
    </script>
    <style>
      .skip-app-splash #pwa-splash-screen {
        display: none !important;
      }

      /* Unified Single Splash Screen on PWA Launch */
      #pwa-splash-screen {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background-color: #581c87;
        background: linear-gradient(160deg, #4c1d95 0%, #581c87 50%, #3b0764 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: opacity;
      }

      #pwa-splash-screen.pwa-splash-fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .pwa-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        max-width: 340px;
        width: 100%;
        box-sizing: border-box;
      }

      /* Clean logo matching native OS launch icon exactly */
      .pwa-splash-logo-container {
        width: 135px;
        height: 135px;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 22px;
        box-sizing: border-box;
        opacity: 0;
        transform: scale(0.55);
      }

      #pwa-splash-screen.pwa-splash-revealed .pwa-splash-logo-container {
        animation: pwaLogoReveal 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .pwa-splash-logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.25));
      }

      .pwa-splash-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        opacity: 0;
        transform: translateY(8px);
      }

      #pwa-splash-screen.pwa-splash-revealed .pwa-splash-brand {
        animation: pwaBrandReveal 0.55s 0.18s ease-out forwards;
      }

      .pwa-splash-title {
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 1.55rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
      }

      .pwa-splash-subtitle {
        color: #e9d5ff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin: 0;
        opacity: 0.95;
      }

      .pwa-splash-loader {
        margin-top: 26px;
        width: 52px;
        height: 4px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
        opacity: 0;
      }

      #pwa-splash-screen.pwa-splash-revealed .pwa-splash-loader {
        animation: pwaFadeIn 0.35s 0.25s ease-out forwards;
      }

      .pwa-splash-pulse {
        width: 50%;
        height: 100%;
        background: #c4b5fd;
        border-radius: 4px;
        position: absolute;
        animation: pwaPulseBar 1.2s infinite ease-in-out;
      }

      @keyframes pwaLogoReveal {
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes pwaBrandReveal {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pwaFadeIn {
        to {
          opacity: 1;
        }
      }

      @keyframes pwaPulseBar {
        0% {
          left: -50%;
        }
        100% {
          left: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #pwa-splash-screen.pwa-splash-revealed .pwa-splash-logo-container,
        #pwa-splash-screen.pwa-splash-revealed .pwa-splash-brand,
        #pwa-splash-screen.pwa-splash-revealed .pwa-splash-loader {
          animation-duration: 0.01ms;
          animation-delay: 0ms;
        }
      }
    </style>
  </head>
  <body>
    <!-- App Root for React -->
    <div id="root"></div>

    <!-- Single Unified Splash Screen with Loading Animation -->
    <div id="pwa-splash-screen" class="pwa-splash" aria-hidden="true">
      <div class="pwa-splash-inner">
        <div class="pwa-splash-logo-container">
          <img src="/mswdo-pwa-192.png" alt="MSWDO Vinzons" class="pwa-splash-logo" />
        </div>
        <div class="pwa-splash-brand">
          <h1 class="pwa-splash-title">MSWDO - Vinzons</h1>
          <p class="pwa-splash-subtitle">Evacuee Management System</p>
        </div>
        <div class="pwa-splash-loader">
          <div class="pwa-splash-pulse"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
